version: "3.9"

services:
  trainer:
    build: .
    image: openwakeword:cuda
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./data:/workspace/data
      - ./configs:/workspace/configs
    ports:
      - "8888:8888"
    command: bash
